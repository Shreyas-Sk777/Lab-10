<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 10 (c) - Age Verification</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <a href="index.php" class="back-link">← Back to Lab 10 Home</a>

        <div class="card">
            <h2 class="card-title">Part C: Age Verification Gatekeeper</h2>
            <p class="card-desc">Enter your name and age below. The PHP script will check if you are authorized to visit the site.</p>

            <form action="part_c/verify.php" method="POST">
                <div class="form-group">
                    <label for="userName">Full Name <span style="color: #ef4444;">*</span></label>
                    <input type="text" id="userName" name="name" placeholder="e.g. John Doe" required autofocus>
                </div>

                <div class="form-group">
                    <label for="userAge">Age (in years) <span style="color: #ef4444;">*</span></label>
                    <input type="number" id="userAge" name="age" placeholder="e.g. 19" min="1" max="125" required>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">
                        <span>🛡️</span> Submit &amp; Verify
                    </button>
                    <button type="reset" class="btn btn-secondary">
                        <span>🔄</span> Reset
                    </button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
